<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b14;
    --card: #14141f;
    --card-hover: #1c1c2b;
    --border: #262638;
    --text: #ececf4;
    --muted: #9a9ab0;
    --cyan: #22d3ee;
    --magenta: #d946ef;
    --ig1: #feda75;
    --ig2: #fa7e1e;
    --ig3: #d62976;
    --ig4: #962fbf;
    --ig5: #4f5bd5;
  }
  * { box-sizing: border-box; margin: 0; }
  html {
    min-height: 100%;
    background:
      radial-gradient(55rem 28rem at 50% -8rem, rgba(214, 41, 118, .22), transparent 60%),
      radial-gradient(42rem 30rem at 50% 115%, rgba(34, 211, 238, .12), transparent 60%),
      var(--bg);
  }
  body {
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; text-align: center; }

  .avatar-wrap { display: inline-block; position: relative; animation: float 6s ease-in-out infinite; }
  .avatar {
    width: 118px; height: 118px; border-radius: 50%;
    display: block;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(135deg, var(--ig3), var(--ig5), var(--cyan)) border-box;
    box-shadow: 0 0 36px rgba(214, 41, 118, .28);
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 1.6rem; font-weight: 700; margin-top: 18px; letter-spacing: -.01em;
  }
  .handle { color: var(--muted); margin-top: 2px; font-size: .95rem; }

  ul { list-style: none; padding: 0; margin-top: 30px; display: grid; gap: 13px; }

  a.btn {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    color: var(--text); text-decoration: none; font-weight: 550;
    transition: background .18s, border-color .18s, transform .18s, box-shadow .18s;
  }
  a.btn:hover, a.btn:focus-visible { background: var(--card-hover); border-color: var(--cyan); transform: translateY(-2px); }
  a.btn:active { transform: none; }
  a.btn svg { width: 22px; height: 22px; flex: none; }
  a.btn span { flex: 1; text-align: left; }
  a.btn small { color: var(--muted); font-weight: 400; font-size: .85rem; }

  /* Instagram: botón principal */
  a.ig {
    position: relative;
    padding: 20px 22px;
    border: none; border-radius: 18px;
    background: linear-gradient(115deg, var(--ig1), var(--ig2) 28%, var(--ig3) 58%, var(--ig4) 80%, var(--ig5));
    background-size: 160% 160%;
    color: #fff; font-weight: 700; font-size: 1.08rem;
    box-shadow: 0 10px 30px rgba(214, 41, 118, .38);
    animation: shimmer 7s ease infinite;
  }
  a.ig:hover, a.ig:focus-visible { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(214, 41, 118, .5); }
  a.ig svg { width: 28px; height: 28px; }
  a.ig small { color: rgba(255,255,255,.85); font-weight: 500; display: block; font-size: .82rem; margin-top: 1px; }
  @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  footer { color: var(--muted); font-size: .8rem; margin-top: 34px; }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap, a.ig { animation: none; }
  }
</style>
</head>
