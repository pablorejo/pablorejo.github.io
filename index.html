<style>
  :root {
    --bg: #0b0b14;
    --card: #14141f;
    --card-hover: #1c1c2b;
    --border: #262638;
    --text: #ececf4;
    --muted: #9a9ab0;
    --cyan: #22d3ee;
    --magenta: #d946ef;
  }
  * { box-sizing: border-box; margin: 0; }
  html {
    min-height: 100%;
    background:
      radial-gradient(60rem 30rem at 50% -10rem, rgba(217, 70, 239, .18), transparent 60%),
      radial-gradient(40rem 30rem at 50% 110%, rgba(34, 211, 238, .12), transparent 60%),
      var(--bg);
  }
  body {
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px 32px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(135deg, var(--magenta), var(--cyan)) border-box;
    box-shadow: 0 0 32px rgba(34, 211, 238, .25);
  }
  h1 { font-size: 1.5rem; font-weight: 650; margin-top: 16px; letter-spacing: -.01em; }
  ul { list-style: none; padding: 0; margin-top: 28px; display: grid; gap: 12px; }
  a.btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text); text-decoration: none; font-weight: 550;
    transition: background .15s, border-color .15s, transform .15s;
  }
  a.btn:hover, a.btn:focus-visible { background: var(--card-hover); border-color: var(--cyan); transform: translateY(-1px); }
  a.btn:active { transform: none; }
  a.btn svg { width: 22px; height: 22px; flex: none; }
  a.btn span { flex: 1; text-align: left; }
  a.btn small { color: var(--muted); font-weight: 400; font-size: .85rem; }
  a.btn.primary {
    background: linear-gradient(135deg, rgba(217, 70, 239, .22), rgba(34, 211, 238, .22));
    border-color: rgba(34, 211, 238, .5);
  }
  footer { color: var(--muted); font-size: .8rem; margin-top: 32px; }
</style>
